<!DOCTYPE html>
<!-- Thymeleafの名前空間を宣言する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- 共通headフラグメントを呼び出す（ブラウザタブには記事タイトルを入れる） -->
<head th:replace="~{fragments/layout :: head(${blog.title})}"></head>

<!--
  markdown を変換した HTML を見やすく表示するための専用 CSS
  ※ Tailwind の typography プラグインを使わず素のCSSで完結させている
-->
<style>
    /* 本文ラッパー：行間と最大幅 */
    .markdown-body { color: #475569; line-height: 1.85; font-size: 1.05rem; }

    /* 見出し */
    .markdown-body h1 { font-size: 2rem; font-weight: 800; color: #0f172a; margin: 2.5rem 0 1rem; line-height: 1.3; }
    .markdown-body h2 { font-size: 1.625rem; font-weight: 700; color: #0f172a; margin: 2.5rem 0 1rem; padding-bottom: .5rem; border-bottom: 2px solid #e2e8f0; }
    .markdown-body h3 { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin: 2rem 0 .75rem; }
    .markdown-body h4 { font-size: 1.1rem;  font-weight: 700; color: #1e293b; margin: 1.5rem 0 .5rem; }

    /* 段落 */
    .markdown-body p { margin: 1rem 0; }

    /* 強調 */
    .markdown-body strong { font-weight: 700; color: #0f172a; }
    .markdown-body em { font-style: italic; }

    /* リスト */
    .markdown-body ul, .markdown-body ol { margin: 1rem 0; padding-left: 1.75rem; }
    .markdown-body ul { list-style: disc; }
    .markdown-body ol { list-style: decimal; }
    .markdown-body li { margin: .35rem 0; }

    /* 引用 */
    .markdown-body blockquote {
        margin: 1.25rem 0; padding: .75rem 1rem;
        border-left: 4px solid #0ea5e9;
        background: #f0f9ff; color: #334155; border-radius: .25rem;
    }

    /* コード */
    .markdown-body code {
        background: #f1f5f9; color: #db2777;
        padding: .15rem .4rem; border-radius: .25rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .9em;
    }
    .markdown-body pre {
        background: #0f172a; color: #f1f5f9;
        padding: 1rem 1.25rem; border-radius: .5rem;
        overflow-x: auto; margin: 1.25rem 0;
    }
    .markdown-body pre code { background: transparent; color: inherit; padding: 0; }

    /* 区切り線 (---) */
    .markdown-body hr { border: 0; border-top: 1px solid #e2e8f0; margin: 2.5rem 0; }

    /* リンク */
    .markdown-body a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }
    .markdown-body a:hover { color: #1d4ed8; }

    /* 表 */
    .markdown-body table {
        width: 100%; border-collapse: collapse;
        margin: 1.25rem 0; font-size: .95em;
        border: 1px solid #e2e8f0; border-radius: .5rem; overflow: hidden;
    }
    .markdown-body th, .markdown-body td { padding: .6rem .9rem; border: 1px solid #e2e8f0; text-align: left; }
    .markdown-body th { background: #f8fafc; color: #0f172a; font-weight: 700; }
    .markdown-body tr:nth-child(even) td { background: #f8fafc; }

    /* 画像 */
    .markdown-body img { max-width: 100%; height: auto; border-radius: .5rem; margin: 1rem 0; }
</style>

<body class="min-h-screen bg-white font-sans">

    <!-- 詳細画面用の簡易ヘッダー -->
    <header class="border-b border-slate-100 bg-white sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- 一覧に戻るリンク -->
            <a th:href="@{/}" class="flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors font-medium text-sm">
                ← ホームに戻る
            </a>
            <!-- ロゴ -->
            <div class="font-bold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-blue-600">
                BrightTech
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 md:py-16">

        <!-- 記事タイトル＆メタ情報 -->
        <div class="mb-8 text-center">
            <!-- カテゴリーバッジ -->
            <div class="mb-6 inline-block">
                <span class="inline-block px-3 py-1 bg-cyan-50 text-cyan-700 text-xs font-bold rounded-full border border-cyan-100"
                      th:text="${blog.category.name}">カテゴリー</span>
            </div>
            <!-- タイトル -->
            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 leading-tight mb-6"
                th:text="${blog.title}">タイトル</h1>
            <!-- 公開日時 -->
            <div class="text-slate-500 font-medium"
                 th:text="${#temporals.format(blog.publishedAt, 'yyyy年MM月dd日')}">2026年01月01日</div>
        </div>

        <!-- アイキャッチ画像（URLがあるときだけ表示） -->
        <div th:if="${!#strings.isEmpty(blog.imageUrl)}"
             class="aspect-video w-full rounded-2xl overflow-hidden mb-12 shadow-lg shadow-blue-900/5">
            <img th:src="${blog.imageUrl}" th:alt="${blog.title}" class="w-full h-full object-cover">
        </div>

        <!--
          本文：Controller が markdown → HTML に変換済みの contentHtml を
          th:utext で「エスケープせずに」出力する
          ※ th:text だと <h2>...</h2> が文字列として表示されてしまうので必ず th:utext
          ※ XSS 対策は MarkdownService 側で escapeHtml(true) が効いている
        -->
        <div class="markdown-body" th:utext="${contentHtml}">
            ここに本文がHTMLとして展開される
        </div>

        <!-- 末尾の「一覧へ戻る」ボタン -->
        <div class="mt-16 pt-8 border-t border-slate-100 text-center">
            <a th:href="@{/}"
               class="inline-flex items-center gap-2 px-6 py-3 bg-slate-100 text-slate-700 font-semibold rounded-full hover:bg-slate-200 transition-colors">
                ← 記事一覧へ戻る
            </a>
        </div>
    </main>
</body>
</html>
