<!DOCTYPE html>
<!-- Thymeleafの名前空間を宣言する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- 共通headフラグメントを呼び出す -->
<head th:replace="~{fragments/layout :: head('カテゴリー管理')}"></head>

<body class="min-h-screen bg-slate-50 font-sans">

    <!-- 管理画面の上部ヘッダー -->
    <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 sticky top-0 z-10">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-bold text-slate-800">カテゴリー管理</h1>
            <nav class="hidden md:flex items-center gap-4 text-sm font-medium">
                <a th:href="@{/admin/blogs}" class="text-slate-500 hover:text-blue-600">ブログ</a>
                <a th:href="@{/admin/categories}" class="text-blue-600">カテゴリー</a>
                <a th:href="@{/admin/profile}" class="text-slate-500 hover:text-blue-600">プロフィール</a>
            </nav>
        </div>
        <div class="flex items-center gap-2">
            <a th:href="@{/}" class="text-sm font-medium text-blue-600 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors hidden sm:block">サイトを表示</a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="text-sm font-medium text-slate-600 bg-slate-100 px-4 py-2 rounded-lg hover:bg-slate-200 transition-colors">ログアウト</button>
            </form>
        </div>
    </header>

    <main class="p-4 md:p-8">

        <!-- フラッシュメッセージ -->
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

            <!-- 一覧ヘッダー -->
            <div class="p-6 border-b border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <h2 class="text-lg font-bold text-slate-800">カテゴリー一覧</h2>
                <a th:href="@{/admin/categories/new}"
                   class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium text-sm hover:bg-blue-700 transition-colors shadow-md shadow-blue-200">
                    + 新規登録
                </a>
            </div>

            <!-- 0件のときのメッセージ -->
            <div th:if="${categories.isEmpty()}" class="text-center py-12 text-slate-500">
                登録されているカテゴリーはありません
            </div>

            <!-- データテーブル -->
            <div th:unless="${categories.isEmpty()}" class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-sm">
                            <th class="py-4 px-6 font-semibold w-16">ID</th>
                            <th class="py-4 px-6 font-semibold">カテゴリー名</th>
                            <th class="py-4 px-6 font-semibold w-32 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <!-- categories の各 Category をループ -->
                        <tr th:each="cat : ${categories}" class="hover:bg-slate-50 transition-colors">
                            <td class="py-4 px-6 text-slate-500 text-sm" th:text="${cat.id}">1</td>
                            <td class="py-4 px-6 font-semibold text-slate-800">
                                <span class="inline-flex items-center gap-2 px-3 py-1 bg-cyan-50 text-cyan-700 text-sm rounded-full border border-cyan-100"
                                      th:text="${cat.name}">カテゴリー名</span>
                            </td>
                            <td class="py-4 px-6">
                                <div class="flex items-center justify-center gap-2">
                                    <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}"
                                       class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors text-xs font-medium">編集</a>
                                    <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" class="inline"
                                          onsubmit="return confirm('本当にこのカテゴリーを削除しますか？');">
                                        <button type="submit"
                                                class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors text-xs font-medium">
                                            削除
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
