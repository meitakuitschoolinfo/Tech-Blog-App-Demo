<!DOCTYPE html>
<!-- Thymeleafの名前空間を宣言する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- 共通headフラグメントを呼び出す -->
<head th:replace="~{fragments/layout :: head('プロフィール')}"></head>

<body class="min-h-screen bg-slate-50 font-sans">

    <!-- 管理画面の上部ヘッダー -->
    <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 sticky top-0 z-10">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-bold text-slate-800">プロフィール</h1>
            <nav class="hidden md:flex items-center gap-4 text-sm font-medium">
                <a th:href="@{/admin/blogs}" class="text-slate-500 hover:text-blue-600">ブログ</a>
                <a th:href="@{/admin/categories}" class="text-slate-500 hover:text-blue-600">カテゴリー</a>
                <a th:href="@{/admin/profile}" class="text-blue-600">プロフィール</a>
            </nav>
        </div>
        <div class="flex items-center gap-2">
            <a th:href="@{/}" class="text-sm font-medium text-blue-600 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors hidden sm:block">サイトを表示</a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="text-sm font-medium text-slate-600 bg-slate-100 px-4 py-2 rounded-lg hover:bg-slate-200 transition-colors">ログアウト</button>
            </form>
        </div>
    </header>

    <main class="p-4 md:p-8">

        <!-- フラッシュメッセージ -->
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="max-w-xl mx-auto">

            <!--
              プロフィール更新フォーム
              th:action は /admin/profile に POST する（ID は URL ではなくサーバー側でログイン情報から取る）
              th:object は MyPageController が用意した userRegisterForm
            -->
            <form th:action="@{/admin/profile}" th:object="${userRegisterForm}" method="post"
                  class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

                <!-- カード上部：アバター＆名前 -->
                <div class="p-8 text-center border-b border-slate-100 bg-slate-50/50">
                    <div class="w-24 h-24 bg-gradient-to-br from-blue-100 to-cyan-100 text-blue-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4 border-4 border-white shadow-sm"
                         th:text="${#strings.substring(userRegisterForm.name, 0, 1)}">A</div>
                    <h3 class="text-xl font-bold text-slate-800" th:text="${userRegisterForm.name}">管理者名</h3>
                    <p class="text-slate-500 text-sm">システム管理者</p>
                </div>

                <div class="p-6 md:p-8 space-y-5">

                    <!-- 全体エラー表示（メール重複など） -->
                    <div th:replace="~{fragments/layout :: globalErrors}"></div>

                    <!-- 名前 -->
                    <div>
                        <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">名前</label>
                        <input type="text" th:field="*{name}"
                               class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                        <div th:replace="~{fragments/layout :: fieldError('name')}"></div>
                    </div>

                    <!-- メールアドレス -->
                    <div>
                        <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">メールアドレス</label>
                        <input type="email" th:field="*{email}"
                               class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                        <div th:replace="~{fragments/layout :: fieldError('email')}"></div>
                    </div>

                    <!-- パスワード（更新時に必ず入力する運用） -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">パスワード（8文字以上 / 更新時も再入力が必要）</label>
                        <input type="password" th:field="*{password}"
                               class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                               placeholder="••••••••">
                        <div th:replace="~{fragments/layout :: fieldError('password')}"></div>
                    </div>
                </div>

                <!-- 送信ボタン -->
                <div class="px-6 md:px-8 py-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                    <button type="submit"
                            class="px-8 py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 shadow-md transition-colors">
                        プロフィールを保存
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
