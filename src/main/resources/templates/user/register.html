<!DOCTYPE html>
<!-- Thymeleafの名前空間を宣言する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- 共通headフラグメントを引数 '管理者登録' で呼び出す -->
<head th:replace="~{fragments/layout :: head('管理者登録')}"></head>

<!-- 背景はログイン画面と同じグラデーション -->
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center p-4 font-sans">

    <!-- 中央のカード -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl shadow-blue-900/5 p-8 md:p-12">

        <!-- 見出しブロック -->
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200 mx-auto mb-6 text-2xl font-bold">
                BT
            </div>
            <h1 class="text-2xl font-bold text-slate-800">管理者登録</h1>
            <p class="text-slate-500 mt-2 text-sm">新しい管理者アカウントを作成します</p>
        </div>

        <!--
          管理者登録フォーム
          - th:action は POST /admin/register に送る（Controllerは第7章で作る）
          - th:object は UserRegisterForm に紐づく
        -->
        <form th:action="@{/admin/register}" th:object="${userRegisterForm}" method="post" class="space-y-5">

            <!-- 管理者名 -->
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">管理者名</label>
                <!-- th:field="*{name}" は UserRegisterForm.name と紐づく -->
                <input type="text" th:field="*{name}"
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                       placeholder="例: 管理者 太郎">
                <!-- name 項目のバリデーションエラー表示 -->
                <div th:replace="~{fragments/layout :: fieldError('name')}"></div>
            </div>

            <!-- メールアドレス -->
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">メールアドレス</label>
                <!-- th:field="*{email}" は UserRegisterForm.email と紐づく -->
                <input type="email" th:field="*{email}"
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                       placeholder="admin@example.com">
                <!-- email 項目のバリデーションエラー表示（@NotBlank / @Email / @Size） -->
                <div th:replace="~{fragments/layout :: fieldError('email')}"></div>
            </div>

            <!-- パスワード -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">パスワード（8文字以上）</label>
                <!-- th:field="*{password}" は UserRegisterForm.password と紐づく（生パスワード→Service側でハッシュ化） -->
                <input type="password" th:field="*{password}"
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                       placeholder="••••••••">
                <!-- password 項目のバリデーションエラー表示（@NotBlank / @Size） -->
                <div th:replace="~{fragments/layout :: fieldError('password')}"></div>
            </div>

            <!-- 送信ボタン -->
            <button type="submit"
                    class="w-full py-4 mt-2 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all duration-200">
                登録してログイン
            </button>
        </form>

        <!-- 補助リンク -->
        <div class="mt-8 text-center space-y-4">
            <p class="text-sm text-slate-500">
                既にアカウントをお持ちの場合は
                <a th:href="@{/login}" class="text-blue-600 hover:underline ml-1 font-medium">ログイン</a>
            </p>
        </div>
    </div>
</body>
</html>
